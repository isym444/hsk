@if (unit().audio) {
  <button class="playbtn" type="button" (click)="play()">🔊 Play audio</button>
}

<p class="statement"><span class="star">★</span> {{ unit().statement }}</p>

<div class="tfrow">
  @for (part of parts; track $index) {
    <button class="optbtn" type="button" [class]="buttonClass($index)" [disabled]="!locked()" (click)="pick($index)">{{ labels[$index] }}</button>
  }
</div>

@if (choice() !== null) {
  <div class="feedback">
    <div class="fbline" [class.good]="isCorrect()" [class.bad]="!isCorrect()">
      @if (isCorrect()) {
        ✓ Correct
      } @else {
        ✗ Incorrect · answer: {{ solutionLabel() }}
      }</div>
    @if (unit().audio) {
      <div class="transcript-label">Transcript</div>
      <div class="transcript">{{ unit().audio }}</div>
    }
  </div>
}
