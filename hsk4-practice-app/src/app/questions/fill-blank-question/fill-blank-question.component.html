<p class="statement">{{ unit().sentence }}</p>

<div class="bank">
  @for (word of bankChoices(); track $index) {
    <button
      type="button"
      [class]="chipClass($index)"
      [disabled]="choice() !== null"
      (click)="pick($index)"
    >
      <span class="lt">{{ word.letter }}</span>{{ word.word }}
    </button>
  }
</div>

@if (choice() !== null) {
  <div class="feedback">
    <div class="fbline" [class.good]="isCorrect()" [class.bad]="!isCorrect()">
      @if (isCorrect()) {
        ✓ Correct
      } @else {
        ✗ Incorrect · answer: {{unit().answer}}
      }</div>
  </div>
}
