<p class="statement">{{ unit().sentence }}</p>

<div class="bank">
  @for (word of bankChoices(); track $index) {
    <button
      type="button"
      [class]="chipClass($index)"
      [disabled]="review() || choice() !== null"
      (click)="pick($index)"
    >
      <span class="lt">{{ word.letter }}</span>{{ word.word }}
    </button>
  }
</div>

@if (review() || choice() !== null) {
  <div class="feedback">
    @if (review()) {
      <div class="fbline good">Correct answer: {{ unit().answer }}</div>
    } @else {
      <div class="fbline" [class.good]="isCorrect()" [class.bad]="!isCorrect()">
        @if (isCorrect()) {
          ✓ Correct
        } @else {
          ✗ Incorrect · answer: {{unit().answer}}
        }</div>
    }
  </div>
}
