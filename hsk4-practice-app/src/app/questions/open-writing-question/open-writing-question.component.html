<p class="question">Write a sentence using this word (the original item came with a picture, omitted here):</p>

<div class="wordpill">{{unit().word}}</div>

@if (!review()) {
  <textarea
    class="opentext"
    placeholder="Type your sentence here…"
    [disabled]="revealed()"
    (input)="onInput($any($event.target).value)"
  ></textarea>

  <div class="rowbtns">
    <button class="smallbtn" type="button" [disabled]="revealed()" (click)="reveal()">
      Show model answer
    </button>
  </div>
}

@if (review()) {
  <div class="feedback">
    <div class="fbline good">Model answer</div>
    <div class="model">{{ unit().model }}</div>
  </div>
} @else if (revealed()) {
  <div class="feedback">
    <div class="fbline good">
      @if (usedTargetWord()) {
        {{ prompt() }}
      } @else {
        {{ hint() }}
      }
    </div>
    <div class="model">
      <div class="lbl">Model answer</div>{{ unit().model }}
    </div>
  </div>
}
