# Serves the built Angular app and forwards API calls to the `api` service.
#
# The frontend calls /api with relative URLs (see review-api.service.ts), so
# serving both from one origin here is exactly what the app expects.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change under the same name.
    location ~* \.(?:js|css|woff2?|ico|png|jpe?g|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated, or a deploy would keep serving the
    # previous bundle's asset names.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Runtime configuration is read once at startup and differs per deployment
    # (Supabase project, API base, dev bypass). Never let a browser cache it: a
    # stale copy makes a corrected deployment look broken until a hard refresh.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # `^~` so the asset regex below can never swallow an API path.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The FastAPI docs, handy through the same origin.
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Angular uses real routes (/stats/reading, /deck/writing/summary/<id>), so
    # anything unmatched has to return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
