<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 四级 · 逐题练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --ink:#211D1A; --ink-soft:#6B6259; --line:#E4DED2;
  --accent:#B23A2E; --accent-ink:#FFFFFF;
  --listen:#3F7D6E; --read:#B23A2E; --write:#B8863B;
  --good:#2F8F5B; --good-bg:#E9F5EE; --bad:#C6433A; --bad-bg:#FBEAE8;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1815; --surface:#242019; --ink:#F1ECE3; --ink-soft:#B4A99A; --line:#3A342C;
    --accent:#E2857A; --listen:#6FC0AC; --read:#E2857A; --write:#E0B36E;
    --good:#57C98B; --good-bg:#1D3327; --bad:#E2685B; --bad-bg:#3A241F;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1815; --surface:#242019; --ink:#F1ECE3; --ink-soft:#B4A99A; --line:#3A342C;
  --accent:#E2857A; --listen:#6FC0AC; --read:#E2857A; --write:#E0B36E;
  --good:#57C98B; --good-bg:#1D3327; --bad:#E2685B; --bad-bg:#3A241F;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
  line-height:1.6;
}
.heading{font-family:"Zilla Slab","PingFang SC","Microsoft YaHei",serif; font-weight:700;}
.wrap{max-width:720px; margin:0 auto; padding:28px 20px 64px;}
a{color:inherit;}

/* ---------- Home ---------- */
.hero h1{font-size:28px; margin:0 0 6px; letter-spacing:.2px;}
.hero p{color:var(--ink-soft); margin:0 0 28px; font-size:15px; max-width:56ch;}
.testrow{border-top:1px solid var(--line); padding:20px 0;}
.testrow:last-child{border-bottom:1px solid var(--line);}
.testrow-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.testrow-head .id{font-size:22px;}
.testrow-head .meta{color:var(--ink-soft); font-size:13px;}
.sectionbtns{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.secbtn{
  display:flex; flex-direction:column; gap:2px; text-align:left;
  border:1px solid var(--line); border-left:3px solid var(--c,var(--accent));
  background:var(--surface); border-radius:6px; padding:10px 12px;
  cursor:pointer; color:var(--ink); font:inherit;
}
.secbtn:hover{border-color:var(--c,var(--accent));}
.secbtn .name{font-weight:600; font-size:14.5px;}
.secbtn .count{font-size:12px; color:var(--ink-soft);}
.footnote{margin-top:30px; color:var(--ink-soft); font-size:12.5px; line-height:1.7;}
.footnote a{text-decoration:underline;}

/* ---------- Quiz chrome ---------- */
.hidden{display:none !important;}
.qz-top{
  position:sticky; top:0; padding-top:env(safe-area-inset-top,0px);
  background:var(--bg); border-bottom:1px solid var(--line); z-index:5;
}
.qz-topinner{max-width:720px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:12px;}
.backbtn{
  border:none; background:none; color:var(--ink-soft); font:inherit; cursor:pointer;
  font-size:14px; padding:4px 0; flex-shrink:0;
}
.backbtn:hover{color:var(--ink);}
.qz-label{font-size:13px; color:var(--ink-soft); flex:1;}
.qz-label b{color:var(--ink); font-weight:600;}
.qz-score{font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap;}
.qz-score .g{color:var(--good);} .qz-score .b{color:var(--bad);}
.progress{height:3px; background:var(--line);}
.progress > div{height:100%; background:var(--c,var(--accent)); transition:width .25s ease;}

.card{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--c,var(--accent));
  border-radius:var(--radius); padding:22px 22px 20px; margin-top:22px;
}
.tag{font-size:12px; color:var(--c,var(--accent)); font-weight:600; margin-bottom:10px;}
.playbtn{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--c,var(--accent));
  color:var(--c,var(--accent)); background:transparent; border-radius:20px; padding:9px 18px;
  font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; margin-bottom:16px;
}
.playbtn:active{transform:scale(.98);}
.statement{font-size:17px; margin:0 0 16px; line-height:1.75;}
.statement .star{color:var(--c,var(--accent));}
.passage{font-size:16px; line-height:1.85; margin:0 0 16px; white-space:pre-line;}
.question{font-size:16px; font-weight:600; margin:0 0 14px;}
.options{display:flex; flex-direction:column; gap:9px;}
.optbtn{
  text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:8px; padding:12px 14px; font:inherit; font-size:15px; cursor:pointer;
  display:flex; gap:10px;
}
.optbtn .lt{font-weight:700; color:var(--ink-soft); flex-shrink:0;}
.optbtn:hover:not(:disabled){border-color:var(--c,var(--accent));}
.optbtn:disabled{cursor:default;}
.optbtn.correct{border-color:var(--good); background:var(--good-bg);}
.optbtn.correct .lt{color:var(--good);}
.optbtn.wrong{border-color:var(--bad); background:var(--bad-bg);}
.optbtn.wrong .lt{color:var(--bad);}
.optbtn.dim{opacity:.55;}

.tfrow{display:flex; gap:10px; margin-bottom:4px;}
.tfrow .optbtn{flex:1; text-align:center; justify-content:center;}

.feedback{margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}
.fbline{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; margin-bottom:8px;}
.fbline.good{color:var(--good);} .fbline.bad{color:var(--bad);}
.transcript{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:14.5px; white-space:pre-line; line-height:1.75; margin-top:6px;}
.transcript-label{font-size:12px; color:var(--ink-soft); margin-bottom:6px; text-transform:none;}

.bank{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.bankchip{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:20px; padding:8px 16px; font:inherit; font-size:14.5px; cursor:pointer;
}
.bankchip .lt{font-weight:700; color:var(--ink-soft); margin-right:6px;}
.bankchip:hover:not(:disabled){border-color:var(--c,var(--accent));}
.bankchip.correct{border-color:var(--good); background:var(--good-bg); color:var(--good);}
.bankchip.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--bad);}
.bankchip:disabled{cursor:default;}

.ordersent{margin:2px 0 16px;}
.ordersent div{padding:6px 0; font-size:15.5px;}
.ordersent b{color:var(--c,var(--accent)); margin-right:8px;}
.permgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.permbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:10px 6px; font:inherit; font-size:14px; cursor:pointer;}
.permbtn:hover:not(:disabled){border-color:var(--c,var(--accent));}
.permbtn.correct{border-color:var(--good); background:var(--good-bg); color:var(--good);}
.permbtn.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--bad);}
.permbtn:disabled{cursor:default;}

.tilepool{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; min-height:44px;}
.tile{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:10px 14px; font:inherit; font-size:15.5px; cursor:pointer;}
.tile:hover{border-color:var(--c,var(--accent));}
.tile:disabled{opacity:.35; cursor:default;}
.answerstrip{
  min-height:52px; border:1px dashed var(--line); border-radius:8px; padding:10px 12px;
  display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:16px; margin-bottom:14px;
}
.answerstrip .placeholder{color:var(--ink-soft); font-size:14px;}
.answerstrip .atile{background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer;}
.rowbtns{display:flex; gap:10px;}
.smallbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:9px 16px; font:inherit; font-size:14px; cursor:pointer;}
.smallbtn:disabled{opacity:.4; cursor:default;}

textarea.opentext{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:12px 14px; font:inherit;
  font-size:15.5px; color:var(--ink); background:var(--surface); resize:vertical; min-height:70px; margin-bottom:12px;
}
.wordpill{display:inline-block; border:1px solid var(--c,var(--accent)); color:var(--c,var(--accent)); border-radius:20px; padding:8px 18px; font-size:18px; font-weight:600; margin-bottom:16px;}
.model{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:15.5px; margin-top:10px;}
.model .lbl{font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
.usednote{font-size:13.5px; margin-top:10px;}
.usednote.good{color:var(--good);} .usednote.warn{color:var(--write);}

.nextrow{margin-top:18px; display:flex; justify-content:flex-end;}
.primarybtn{
  border:none; background:var(--c,var(--accent)); color:#fff; border-radius:8px; padding:11px 22px;
  font:inherit; font-size:15px; font-weight:600; cursor:pointer;
}
.primarybtn:disabled{opacity:.4; cursor:default;}

/* ---------- Summary ---------- */
.summary-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px 26px; margin-top:26px; text-align:center;}
.summary-card .big{font-size:44px; font-weight:700; font-family:"Zilla Slab",serif;}
.summary-card .sub{color:var(--ink-soft); font-size:14px; margin-top:4px;}
.summary-open{margin-top:18px; padding-top:18px; border-top:1px dashed var(--line); font-size:14px; color:var(--ink-soft);}
.summary-actions{display:flex; gap:10px; justify-content:center; margin-top:24px;}

@media (max-width:480px){
  .sectionbtns{grid-template-columns:1fr;}
  .permgrid{grid-template-columns:repeat(2,1fr);}
  .wrap{padding:22px 16px 56px;}
}
</style>
</head>
<body>

<div id="home" class="wrap">
  <div class="hero">
    <h1 class="heading">HSK 四级 · 逐题练习</h1>
    <p>三套国家汉办官方样卷（H41001–H41003），听力、阅读、写作齐全。每答一题立刻判对错，不用等到交卷才知道结果。</p>
  </div>
  <div id="testlist"></div>
  <div class="footnote">
    题目来自国家汉办 / 孔子学院总部编制的 HSK（四级）官方样卷。听力部分没有原始录音文件，改用浏览器自带的语音朗读来还原听力材料，点“播放”收听；写作第二部分（看图造句）原题配有插图，这里省去了插图，只保留提示词，答完可对照参考答案自评。
  </div>
</div>

<div id="quiz" class="hidden">
  <div class="qz-top">
    <div class="qz-topinner">
      <button class="backbtn" id="backBtn">← 返回</button>
      <div class="qz-label"><b id="qzTitle"></b> · <span id="qzProgress"></span></div>
      <div class="qz-score" id="qzScore"></div>
    </div>
    <div class="progress"><div id="progressBar" style="width:0%"></div></div>
  </div>
  <div class="wrap" id="qzBody"></div>
</div>

<div id="summary" class="hidden wrap">
  <div class="summary-card">
    <div class="tag" id="sumTag" style="margin-bottom:14px;"></div>
    <div class="big" id="sumScore"></div>
    <div class="sub" id="sumSub"></div>
    <div id="sumOpen" class="summary-open hidden"></div>
    <div class="summary-actions">
      <button class="smallbtn" id="retryBtn">重做一遍</button>
      <button class="primarybtn" id="homeBtn">返回首页</button>
    </div>
  </div>
</div>

<script>
/* ============================== DATA ============================== */
const T=(n,statement,audio,answer)=>({n,statement,audio,answer});
const B=(passage,qs)=>({passage,qs});
const Q=(n,q,o,a)=>({n,q,o,a});
const F=(n,bank,sentence,answer)=>({n,bank,sentence,answer});
const O=(n,s,answer)=>({n,s,answer});
const W=(n,words,orders)=>({n,words,orders});
const P=(n,word,model)=>({n,word,model});

const TESTS = {};

/* ---------------- H41001 ---------------- */
TESTS.H41001 = {
  listening:{
    part1:[
      T(1,"今天天气不错。","喂？我们去树林里走走吧，今天的阳光多好啊，很暖和。好吧？图书馆门口儿见？",true),
      T(2,"他们俩经常聊天。","我经常在电梯里遇到她，可能她也在这座大楼里上班。但是我们从来没有说过话，只是看着很熟悉。",false),
      T(3,"做西红柿鸡蛋汤很简单。","西红柿鸡蛋汤的做法很简单，一点儿也不复杂，准备几个西红柿和鸡蛋就可以了，我保证你一次就能学会。",true),
      T(4,"他爱打篮球。","身高只有一米六零，他是世界上最著名的矮个子篮球运动员。他曾经说过：“篮球不只是让那些高个子打的，也是给那些喜欢它的人们打的。”",true),
      T(5,"小刘受到了表扬。","小刘已经提前完成了全年任务，我希望你们各位也都能像小刘一样，希望你们加油！好，现在让我们一起鼓掌祝贺小刘！",true),
      T(6,"他刚下飞机。","喂，是你啊，我今天去北京出差。我现在在机场，等我到了北京以后再给你打电话好吗？飞机马上就要起飞了。",false),
      T(7,"姐妹俩性格差不多。","虽然她俩是姐妹，性格却很不一样。姐姐非常安静，极少说话，妹妹正好相反，最喜欢和人聊天。",false),
      T(8,"他想给老王一张演出票。","老王，我今晚要加班，这张票浪费了就可惜了。你去看吧，听说这次演出邀请了许多著名的演员，很精彩的。",true),
      T(9,"小张的调查结果写得很好。","小张，你这份计划书写得不错，就按照这个计划去做市场调查吧。下个月我要看调查结果。",false),
      T(10,"女儿不同意打针。","女儿发烧了，我带她去医院。大夫给她打了一针，三岁的女儿尽管很害怕打针，不过她没有哭。",false),
    ],
    part2:[
      B("男：请问，附近有超市吗？\n女：前面那儿有个银行，银行对面有一个小超市。",[Q(11,"问：超市在哪儿？",["银行对面","银行右边","车站附近","使馆西边"],0)]),
      B("女：天都这么晚了，你还出去干什么？\n男：我们明天去上海旅游，我要去买一个轻一点儿的行李箱。",[Q(12,"问：男的现在要去做什么？",["请假","唱歌","散步","买东西"],3)]),
      B("男：怎么又买这么多饼干和巧克力，难道你不减肥了？\n女：减了一个月都没有瘦下来，我实在没有信心了。",[Q(13,"问：女的是什么意思？",["不想吃饭","需要鼓励","放弃减肥","继续运动"],2)]),
      B("女：明天几点到？八点来得及来不及？\n男：提前点儿吧？咱们还得负责打印会议材料呢。",[Q(14,"问：他们要提前做什么？",["准备礼物","打印材料","收拾房间","讨论问题"],1)]),
      B("男：李老师，我下个月五号要结婚了。\n女：你是在开玩笑吧？你们才认识一个月呀。",[Q(15,"问：对于这个消息，女的觉得怎么样？",["很感动","很突然","很后悔","很失望"],1)]),
      B("女：啊，外面下雪了。起床，你快来看看。\n男：太好了！咱们去公园吧？试试你的新照相机，怎么样？",[Q(16,"问：这个照相机怎么样？",["是新的","刚修好","质量不合格","样子很流行"],0)]),
      B("男：我已经出发了，有点儿堵车，到学校大概要四十分钟。\n女：好的，你路上小心，慢慢开，别着急。",[Q(17,"问：男的怎么去学校？",["步行","开车","坐地铁","打出租车"],1)]),
      B("女：听说你准备出国读博士？\n男：是啊，已经申请了。如果顺利的话，下个月就可以出发了。",[Q(18,"问：男的打算做什么？",["结婚","去旅游","出国工作","出国读书"],3)]),
      B("男：小姐，我女儿多少钱一张票？\n女：您好，您的六十，您孩子买儿童票，半价。",[Q(19,"问：女儿的票多少钱一张？",["20块","30块","40块","60块"],1)]),
      B("女：今晚我穿这条裙子怎么样？今年最流行的。\n男：很漂亮，不过我觉得这种打扮参加正式的舞会可能还是不太合适。",[Q(20,"问：男的是什么意思？",["太旧了","很奇怪","有点儿长","最好换一件"],3)]),
      B("男：来北方好几年了吧？你觉得北方和南方在气候上有什么区别？\n女：夏天都差不多，只是冬天北方比较干燥，而南方更湿润。",[Q(21,"问：他们在谈什么？",["气候","文化","风景","职业"],0)]),
      B("女：经理，您对新的办公室环境还满意吗？\n男：不错，谢谢。你可以带我去看看公司别的地方吗？",[Q(22,"问：说话人在哪里？",["花园","教室","公司","宾馆"],2)]),
      B("男：明天的面试很重要，你千万不要迟到。\n女：我知道，你别担心了，我一定会准时到的。",[Q(23,"问：男的希望女的怎么样？",["请客","按时到","别生气","换一个航班"],1)]),
      B("女：你对小李的印象怎么样？\n男：他的优点是有礼貌，诚实，能吃苦，就是太马虎、太粗心了，不适合我们的工作。",[Q(24,"问：小李为什么被拒绝了？",["很穷","很粗心","不专业","不友好"],1)]),
      B("男：怎么忽然想起买花了？要送谁啊？\n女：今天是父亲节，你不会忘了吧？快去买礼物吧。",[Q(25,"问：女的为什么买花？",["父亲节","花很便宜","妈妈生病了","朋友过生日"],0)]),
    ],
    part3:[
      B("女：打了一下午羽毛球，肚子有点儿饿了。\n男：稍等一会儿，饭马上就好。\n女：真香，今天吃什么？\n男：你鼻子真好，今晚我们吃饺子。",[Q(26,"问：他们今晚吃什么？",["面条","米饭","饺子","蛋糕"],2)]),

/* ============================== ENGINE ============================== */
const SECTION_META = {
  listening:{label:"听力", color:"var(--listen)", speak:true},
  reading:{label:"阅读", color:"var(--read)", speak:false},
  writing:{label:"写作", color:"var(--write)", speak:false},
};

function buildUnits(testId, sectionKey){
  const sec = TESTS[testId][sectionKey];
  const units = [];
  if(sectionKey==="listening"){
    sec.part1.forEach(item=>units.push({kind:"tf", n:item.n, statement:item.statement, audio:item.audio, answer:item.answer}));
    sec.part2.forEach(block=>block.qs.forEach(q=>units.push({kind:"mc", n:q.n, passage:block.passage, question:q.q, options:q.o, answer:q.a, speak:true})));
    sec.part3.forEach(block=>block.qs.forEach(q=>units.push({kind:"mc", n:q.n, passage:block.passage, question:q.q, options:q.o, answer:q.a, speak:true})));
  } else if(sectionKey==="reading"){
    sec.part1.forEach(item=>units.push({kind:"fill", n:item.n, bank:item.bank, sentence:item.sentence, answer:item.answer}));
    sec.part2.forEach(item=>units.push({kind:"order", n:item.n, s:item.s, answer:item.answer}));
    sec.part3.forEach(block=>block.qs.forEach(q=>units.push({kind:"mc", n:q.n, passage:block.passage, question:q.q, options:q.o, answer:q.a, speak:false})));
  } else if(sectionKey==="writing"){
    sec.part1.forEach(item=>units.push({kind:"build", n:item.n, words:item.words, orders:item.orders}));
    sec.part2.forEach(item=>units.push({kind:"open", n:item.n, word:item.word, model:item.model}));
  }
  return units;
}

let state = null; // {testId, sectionKey, units, idx, correct, scoreable, openDone}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function speak(text){
  try{
    if(!("speechSynthesis" in window)){ alert("这个浏览器不支持语音朗读，可在回答后查看文字原文。"); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.92;
    const voices = window.speechSynthesis.getVoices();
    const zh = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("zh"));
    if(zh) u.voice = zh;
    window.speechSynthesis.speak(u);
  }catch(e){ /* no-op */ }
}
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = ()=>{};
}

function startSection(testId, sectionKey){
  const units = buildUnits(testId, sectionKey);
  state = {testId, sectionKey, units, idx:0, correct:0, scoreable:0, openDone:0, openTotal: units.filter(u=>u.kind==="open").length};
  document.getElementById("home").classList.add("hidden");
  document.getElementById("summary").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  const meta = SECTION_META[sectionKey];
  document.getElementById("qzTitle").textContent = testId + " · " + meta.label;
  document.documentElement.style.setProperty("--c", meta.color);
  renderQuestion();
}

function updateChrome(){
  const meta = SECTION_META[state.sectionKey];
  document.getElementById("qzProgress").textContent = "第 " + (state.idx+1) + " / " + state.units.length + " 题";
  document.getElementById("qzScore").innerHTML = '<span class="g">✓'+state.correct+'</span> <span class="b">✗'+(state.scoreable-state.correct)+'</span>';
  document.getElementById("progressBar").style.width = Math.round((state.idx)/state.units.length*100)+"%";
  document.getElementById("progressBar").style.setProperty("--c", meta.color);
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function renderQuestion(){
  updateChrome();
  const u = state.units[state.idx];
  const body = document.getElementById("qzBody");
  body.innerHTML = "";
  const meta = SECTION_META[state.sectionKey];
  const card = el("div","card");
  card.style.setProperty("--c", meta.color);
  card.appendChild(el("div","tag", meta.label + " · 第 " + u.n + " 题"));

  if(u.kind==="tf") renderTF(card, u);
  else if(u.kind==="mc") renderMC(card, u);
  else if(u.kind==="fill") renderFill(card, u);
  else if(u.kind==="order") renderOrder(card, u);
  else if(u.kind==="build") renderBuild(card, u);
  else if(u.kind==="open") renderOpen(card, u);

  body.appendChild(card);
}

function goNext(){
  if(state.idx < state.units.length-1){
    state.idx++;
    renderQuestion();
    window.scrollTo({top:0, behavior:"instant"});
  } else {
    showSummary();
  }
}

function addNextButton(card, label){
  const row = el("div","nextrow");
  const btn = el("button","primarybtn", label || (state.idx<state.units.length-1 ? "下一题" : "查看成绩"));
  btn.onclick = goNext;
  row.appendChild(btn);
  card.appendChild(row);
}

/* ---- TF ---- */
function renderTF(card, u){
  if(u.audio){
    const pb = el("button","playbtn","🔊 播放听力");
    pb.onclick = ()=>speak(u.audio);
    card.appendChild(pb);
  }
  card.appendChild(el("p","statement", '<span class="star">★</span> ' + u.statement));
  const row = el("div","tfrow");
  const bTrue = el("button","optbtn","对");
  const bFalse = el("button","optbtn","错");
  row.appendChild(bTrue); row.appendChild(bFalse);
  card.appendChild(row);

  function pick(val, btn, other){
    bTrue.disabled = true; bFalse.disabled = true;
    const isCorrect = (val===u.answer);
    state.scoreable++;
    if(isCorrect) state.correct++;
    btn.classList.add(isCorrect ? "correct" : "wrong");
    const correctBtn = u.answer ? bTrue : bFalse;
    if(correctBtn !== btn) correctBtn.classList.add("correct");
    const fb = el("div","feedback");
    fb.appendChild(el("div","fbline "+(isCorrect?"good":"bad"), isCorrect? "✓ 回答正确":"✗ 回答错误 · 正确答案："+(u.answer?"对":"错")));
    if(u.audio){
      const tlabel = el("div","transcript-label","听力原文");
      const t = el("div","transcript", u.audio);
      fb.appendChild(tlabel); fb.appendChild(t);
    }
    card.appendChild(fb);
    addNextButton(card);
    updateChrome();
  }
  bTrue.onclick = ()=>pick(true, bTrue, bFalse);
  bFalse.onclick = ()=>pick(false, bFalse, bTrue);
}

/* ---- MC (listening dialogue / reading passage) ---- */
function renderMC(card, u){
  if(u.speak){
    const pb = el("button","playbtn","🔊 播放听力");
    pb.onclick = ()=>speak(u.passage);
    card.appendChild(pb);
  } else {
    card.appendChild(el("p","passage", u.passage));
  }
  card.appendChild(el("p","question", u.question));
  const opts = el("div","options");
  const letters = ["A","B","C","D"];
  const btns = [];
  u.options.forEach((opt,i)=>{
    const b = el("button","optbtn",'<span class="lt">'+letters[i]+'</span><span>'+opt+'</span>');
    btns.push(b);
    opts.appendChild(b);
  });
  card.appendChild(opts);

  btns.forEach((b,i)=>{
    b.onclick = ()=>{
      btns.forEach(x=>x.disabled=true);
      const isCorrect = (i===u.answer);
      state.scoreable++;
      if(isCorrect){ state.correct++; b.classList.add("correct"); }
      else{ b.classList.add("wrong"); btns[u.answer].classList.add("correct"); }
      const fb = el("div","feedback");
      fb.appendChild(el("div","fbline "+(isCorrect?"good":"bad"), isCorrect? "✓ 回答正确":"✗ 回答错误 · 正确答案："+letters[u.answer]));
      if(u.speak){
        fb.appendChild(el("div","transcript-label","听力原文"));
        fb.appendChild(el("div","transcript", u.passage));
      }
      card.appendChild(fb);
      addNextButton(card);
      updateChrome();
    };
  });
}

/* ---- Fill in the blank ---- */
function renderFill(card, u){
  card.appendChild(el("p","statement", u.sentence));
  const bank = el("div","bank");
  const letters = ["A","B","C","D","E","F"];
  const chips = [];
  u.bank.forEach((w,i)=>{
    const c = el("button","bankchip",'<span class="lt">'+letters[i]+'</span>'+w);
    chips.push(c);
    bank.appendChild(c);
  });
  card.appendChild(bank);

  chips.forEach((c,i)=>{
    c.onclick = ()=>{
      chips.forEach(x=>x.disabled=true);
      const chosen = u.bank[i];
      const isCorrect = (chosen===u.answer);
      state.scoreable++;
      if(isCorrect){ state.correct++; c.classList.add("correct"); }
      else{
        c.classList.add("wrong");
        const correctIdx = u.bank.indexOf(u.answer);
        if(correctIdx>-1) chips[correctIdx].classList.add("correct");
      }
      const fb = el("div","feedback");
      fb.appendChild(el("div","fbline "+(isCorrect?"good":"bad"), isCorrect? "✓ 回答正确":"✗ 回答错误 · 正确答案：" + u.answer));
      card.appendChild(fb);
      addNextButton(card);
      updateChrome();
    };
  });
}

/* ---- Sentence ordering ---- */
function renderOrder(card, u){
  const wrap = el("div","ordersent");
  ["A","B","C"].forEach((lt,i)=>{
    wrap.appendChild(el("div", null, "<b>"+lt+"</b>"+u.s[i]));
  });
  card.appendChild(wrap);
  card.appendChild(el("p","question","请选出正确的顺序："));
  const perms = ["ABC","ACB","BAC","BCA","CAB","CBA"];
  const grid = el("div","permgrid");
  const btns = [];
  perms.forEach(p=>{
    const b = el("button","permbtn", p.split("").join(" → "));
    btns.push(b);
    grid.appendChild(b);
  });
  card.appendChild(grid);

  btns.forEach((b,i)=>{
    b.onclick = ()=>{
      btns.forEach(x=>x.disabled=true);
      const chosen = perms[i];
      const isCorrect = (chosen===u.answer);
      state.scoreable++;
      if(isCorrect){ state.correct++; b.classList.add("correct"); }
      else{
        b.classList.add("wrong");
        btns[perms.indexOf(u.answer)].classList.add("correct");
      }
      const fb = el("div","feedback");
      fb.appendChild(el("div","fbline "+(isCorrect?"good":"bad"), isCorrect? "✓ 回答正确":"✗ 回答错误 · 正确顺序：" + u.answer.split("").join(" → ")));
      card.appendChild(fb);
      addNextButton(card);
      updateChrome();
    };
  });
}

  const placeholder = el("span","placeholder","依次点击下方词语，组成句子");

  card.appendChild(strip);

  const pool = el("div","tilepool");
  const shuffled = shuffle(u.words.map((w,i)=>({w,i})));
  const tiles = [];
  const chosen = []; // array of {w,i}

  function renderStrip(){
    strip.innerHTML = "";
    if(chosen.length===0){ strip.appendChild(placeholder); return; }
    chosen.forEach((item)=>{
      const at = el("span","atile", item.w);
      strip.appendChild(at);
    });
  }

  shuffled.forEach(item=>{
    const t = el("button","tile", item.w);
    tiles.push({btn:t, item});
    t.onclick = ()=>{
      t.disabled = true;
      chosen.push(item.w);
      renderStrip();
      if(chosen.length===u.words.length){
        checkBuild();
      }
    };
    pool.appendChild(t);
  });
  card.appendChild(pool);

  const rowbtns = el("div","rowbtns");
  const undo = el("button","smallbtn","撤销上一个");
  undo.onclick = ()=>{
    if(chosen.length===0) return;
    chosen.pop();
    tiles.forEach(t=>{ if(t.btn.disabled) return; });
    // re-enable last used tile: find a disabled tile matching last removed word not currently chosen count
    // simplest: rebuild pool state from chosen[] counts
    const counts = {};
    chosen.forEach(w=>counts[w]=(counts[w]||0)+1);
    tiles.forEach(t=>{ t.btn.disabled = false; });
    // now disable exactly according to counts, walking tiles in original order
    const used = {};
    tiles.forEach(t=>{
      const w = t.item.w;
      used[w] = used[w]||0;
      if(used[w] < (counts[w]||0)){ t.btn.disabled = true; used[w]++; }
    });
    renderStrip();
  };
  rowbtns.appendChild(undo);
  card.appendChild(rowbtns);

  function checkBuild(){
    tiles.forEach(t=>t.btn.disabled=true);
    undo.disabled = true;
    const isCorrect = u.orders.some(order=> order.length===chosen.length && order.every((w,i)=>w===chosen[i]));
    state.scoreable++;
    if(isCorrect) state.correct++;
    const fb = el("div","feedback");
    fb.appendChild(el("div","fbline "+(isCorrect?"good":"bad"), isCorrect? "✓ 语序正确":"✗ 语序不对"));
    if(!isCorrect){
      fb.appendChild(el("div","transcript-label","参考答案"));
      fb.appendChild(el("div","transcript", u.orders[0].join("")+"。"));
    }
    card.appendChild(fb);
    addNextButton(card);
    updateChrome();
  }
}

/* ---- Open-ended writing (part 2, picture prompt) ---- */
function renderOpen(card, u){
  card.appendChild(el("p","question","用这个词写一句话（原题配有图片，这里省略）："));
  card.appendChild(el("div","wordpill", u.word));
  const ta = el("textarea","opentext");
  ta.placeholder = "在这里输入你的句子…";
  card.appendChild(ta);
  const row = el("div","rowbtns");
  const showBtn = el("button","smallbtn","查看参考答案");
  row.appendChild(showBtn);
  card.appendChild(row);

  showBtn.onclick = ()=>{
    ta.disabled = true;
    showBtn.disabled = true;
    state.openDone++;
    const fb = el("div","feedback");
    const used = ta.value.includes(u.word);
    fb.appendChild(el("div","fbline good", used? "你的句子里用到了「"+u.word+"」":"提示：可以对照参考答案，看看怎么用「"+u.word+"」造句"));
    fb.appendChild(el("div","model", '<div class="lbl">参考答案</div>' + u.model));
    card.appendChild(fb);
    addNextButton(card);
  };
}

/* ---- Summary ---- */
function showSummary(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("summary").classList.remove("hidden");
  const meta = SECTION_META[state.sectionKey];
  document.documentElement.style.setProperty("--c", meta.color);
  document.getElementById("sumTag").textContent = state.testId + " · " + meta.label + " · 完成";
  document.getElementById("sumTag").style.color = meta.color;
  const pct = state.scoreable ? Math.round(state.correct/state.scoreable*100) : 100;
  document.getElementById("sumScore").textContent = state.correct + " / " + state.scoreable;
  document.getElementById("sumSub").textContent = "正确率 " + pct + "%";
  const openBox = document.getElementById("sumOpen");
  if(state.openTotal>0){
    openBox.classList.remove("hidden");
    openBox.textContent = "写作开放题（看图造句）已完成 " + state.openDone + " / " + state.openTotal + " 题 — 已对照参考答案自评，不计入正确率。";
  } else {
    openBox.classList.add("hidden");
  }
}

/* ---- Home rendering ---- */
function renderHome(){
  const list = document.getElementById("testlist");
  list.innerHTML = "";
  Object.keys(TESTS).forEach(testId=>{
    const row = el("div","testrow");
    const head = el("div","testrow-head");
    head.appendChild(el("div","id heading", testId));
    head.appendChild(el("div","meta","官方样卷 · 100 题"));
    row.appendChild(head);
    const btns = el("div","sectionbtns");
    [["listening",45],["reading",40],["writing",15]].forEach(([key,count])=>{
      const meta = SECTION_META[key];
      const b = el("button","secbtn",'<span class="name">'+meta.label+'</span><span class="count">'+count+' 题</span>');
      b.style.setProperty("--c", meta.color);
      b.onclick = ()=>startSection(testId, key);
      btns.appendChild(b);
    });
    row.appendChild(btns);
    list.appendChild(row);
  });
}

document.getElementById("backBtn").onclick = ()=>{
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("summary").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
};
document.getElementById("homeBtn").onclick = ()=>{
  document.getElementById("summary").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
};
document.getElementById("retryBtn").onclick = ()=>{
  startSection(state.testId, state.sectionKey);
};

renderHome();
</script>
