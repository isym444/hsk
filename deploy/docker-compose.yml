# The HSK4 review API on the Hostinger VPS, routed by the Traefik instance that
# is already running there.
#
#   cd deploy
#   cp .env.example .env      # then fill it in
#   docker compose pull
#   docker compose up -d
#
# See deploy/README.md for the full runbook.
#
# ---------------------------------------------------------------------------
# Why there is no `networks:` block here.
#
# Traefik on this box runs with `network_mode: host` and is attached to no
# Docker network — confirmed with:
#     docker inspect traefik-lqfm-traefik-1 \
#       --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
#     -> host
#
# So there is no shared network to join. This service takes the default compose
# bridge, and Traefik reaches it by container IP through the Docker socket. That
# is exactly the shape of the working net-worth-api service, which also declares
# no network.
#
# Traefik's own flags, for reference:
#   --providers.docker.exposedbydefault=false   -> traefik.enable=true is required
#   --entrypoints.websecure.address=:443        -> routers belong on `websecure`
#   --certificatesresolvers.letsencrypt.acme…   -> tls.certresolver=letsencrypt
#   --entrypoints.web.http.redirections…        -> http→https is global, so this
#                                                  file needs no redirect router
# ---------------------------------------------------------------------------

name: hsk4-practice

services:
  api:
    image: ghcr.io/isym444/hsk4-practice-api:latest
    # Re-pull on every `up`, so a deploy is `docker compose pull && up -d`.
    pull_policy: always
    restart: unless-stopped

    # HSK_DATABASE_URL, HSK_DB_SCHEMA, HSK_SUPABASE_URL, HSK_ALLOWED_EMAILS,
    # HSK_CORS_ORIGINS, pool sizes.
    env_file:
      - .env

    environment:
      traefik.enable: "true"

      # Route every request for the hostname to this container.
      traefik.http.routers.hsk4-api.rule: "Host(`ftapi.isym.uk`)"
      traefik.http.routers.hsk4-api.entrypoints: "websecure"
      traefik.http.routers.hsk4-api.tls.certresolver: "letsencrypt"

      # uvicorn listens here (Dockerfile EXPOSE 8000).
      traefik.http.services.hsk4-api.loadbalancer.server.port: "8000"

    # Keeps a chatty container from filling a small VPS disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
