# Tests the whole repo (API against both databases, plus the Angular suite) and
# publishes the image the Hostinger VPS runs.
#
# The published tag is `ghcr.io/isym444/hsk4-practice-api:latest` (plus the
# commit sha). The repository is private, so the GHCR package is private too:
# the VPS must `docker login ghcr.io` once with a PAT that has `read:packages`
# (or the package can be made public in the GitHub UI). See deploy/README.md.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'hsk4-practice-app/src/**'
      - 'hsk4-practice-app/public/**'
      - 'hsk4-practice-app/angular.json'
      - 'hsk4-practice-app/karma.conf.js'
      - 'hsk4-practice-app/package.json'
      - 'hsk4-practice-app/package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'hsk4-practice-app/src/**'
      - 'hsk4-practice-app/public/**'
      - 'hsk4-practice-app/angular.json'
      - 'hsk4-practice-app/karma.conf.js'
      - 'hsk4-practice-app/package.json'
      - 'hsk4-practice-app/package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hsk4-practice-api

jobs:
  test:
    name: "Tests (API: SQLite + PostgreSQL, UI: karma)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hsk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hsk4-practice-app/package-lock.json

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # The catalogue-sync test bundles the Angular data layer with esbuild to
      # prove data/*.data.ts and backend/data/catalogue.json have not drifted.
      - name: Install frontend dependencies
        working-directory: hsk4-practice-app
        run: npm ci

      - name: pytest (SQLite)
        working-directory: backend
        run: python -m pytest -q

      - name: pytest (PostgreSQL — the production dialect)
        working-directory: backend
        env:
          HSK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hsk
        run: python -m pytest -q

      # Catches a broken build before Render's own build fails on deploy.
      - name: Build the Angular bundle
        working-directory: hsk4-practice-app
        run: npm run build

      - name: Frontend unit tests
        working-directory: hsk4-practice-app
        env:
          # karma.conf.js launches Chrome via CHROME_BIN; the runner ships one.
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test

  publish:
    name: Publish image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by GitHub; no PAT secret needed to push from Actions.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
